:root{--beige:#EEEAD7;--cream:#F7F4EA;--orange:#E8672C;--olive:#6F7B3B;--olive-dk:#454D22;--lav:#CF9CD7;--ink:#2A2721}
*{box-sizing:border-box;margin:0}
html{background:var(--beige)}
body{min-height:100vh;background:var(--beige) url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjE0Ij48cmVjdCB5PSIxMyIgd2lkdGg9IjgiIGhlaWdodD0iMS40IiBmaWxsPSIjMkEyNzIxIiBmaWxsLW9wYWNpdHk9Ii4wNSIvPjwvc3ZnPg==);color:var(--ink);font-family:Rubik,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{position:relative;max-width:460px;margin:0 auto;padding:36px 20px calc(40px + env(safe-area-inset-bottom))}
.logo{display:block;width:min(64%,250px);height:auto;margin:0 auto}
h1{font-family:Lalezar,Rubik,sans-serif;font-weight:400;text-align:center;line-height:1.15;margin-top:14px}
h1 .a{display:block;font-size:26px;color:var(--olive-dk)}
h1 .b{display:block;font-size:34px;color:var(--orange);text-shadow:-3px 3px 0 var(--olive-dk)}
h2{font-family:Lalezar,Rubik,sans-serif;font-weight:400;font-size:24px;color:var(--olive);text-align:center;margin:26px 0 14px}
.list{display:flex;flex-direction:column;gap:16px}
.btn{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--cream);border-radius:22px;box-shadow:6px 6px 0 var(--olive);text-decoration:none;color:inherit;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--olive)}
.btn:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.ic{flex:none;width:54px;height:54px;border-radius:50%;background:var(--beige);display:grid;place-items:center}
.ic svg{width:32px;height:32px}
.tx{flex:1;display:flex;flex-direction:column;min-width:0}
.lb{font-size:14px;font-weight:500;color:var(--olive)}
.vl{font-size:18px;font-weight:700;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{flex:none;width:22px;height:22px}
footer{margin-top:34px;text-align:center;font-family:Barlow,sans-serif;letter-spacing:3px;font-size:15px;color:var(--olive)}
.sp{position:absolute;width:18px;height:18px}
.s1{top:40px;right:22px}.s2{top:120px;left:20px;width:14px}.s3{top:300px;left:28px;width:13px}
@media (hover:hover){.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--olive)}}
</style></head>
